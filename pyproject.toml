[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-movesim"
version = "0.2.1"
description = "Tick-level Counter-Strike 2 movement simulator, trajectory-tracking controller and OpenCS2 calibration benchmarks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "370025263", email = "370025263@qq.com"}]
keywords = ["counter-strike", "cs2", "movement", "simulator", "behavior-cloning", "opencs2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
opencs2 = ["pandas>=1.3", "pyarrow>=8"]
dev = ["pytest>=7", "pandas>=1.3", "pyarrow>=8"]

[project.scripts]
cs2movesim = "cs2movesim.cli:main"

[project.urls]
Homepage = "https://github.com/370025263/cs2-movesim"

[tool.setuptools.packages.find]
where = ["src"]
